name: Deploy Wazuh Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action à effectuer'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: eu-north-1
  TF_VERSION: "1.15.8"

permissions:
  contents: read

jobs:
  test:
    name: Validation du code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4.2.2

      - name: Configuration des credentials AWS
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configuration de la clé SSH publique
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/wazuh-key.pub
          chmod 600 ~/.ssh/wazuh-key.pub

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Installation d'Ansible et ansible-lint
        run: pip install ansible==10.7.0 ansible-lint==24.12.2

      - name: Vérification syntaxe du playbook
        run: ansible-playbook --syntax-check ansible/wazuh.yml -i ansible/inventory.ini

      - name: Ansible Lint
        run: ansible-lint ansible/wazuh.yml

  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4.2.2

      - name: Configuration des credentials AWS
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configuration de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configuration de la clé SSH publique
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/wazuh-key.pub
          chmod 600 ~/.ssh/wazuh-key.pub

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Plan
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Sauvegarde du plan Terraform
        if: ${{ github.event.inputs.action != 'destroy' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Terraform Apply
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform -chdir=terraform destroy -auto-approve

      - name: Sauvegarde de l'inventaire Ansible
        if: ${{ github.event.inputs.action != 'destroy' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ansible-inventory
          path: ansible/inventory.ini

  ansible:
    name: Installation de Wazuh
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ github.event.inputs.action != 'destroy' }}
    timeout-minutes: 60

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4.2.2

      - name: Récupération de l'inventaire généré
        uses: actions/download-artifact@v4.1.8
        with:
          name: ansible-inventory
          path: ansible/

      - name: Installation d'Ansible
        run: pip install ansible==10.7.0

      - name: Configuration de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Création du fichier vault
        run: |
          echo "tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}" > ansible/vault.yml
          echo "postfix_sasl_passwd: '${{ secrets.POSTFIX_SASL_PASSWD }}'" >> ansible/vault.yml
          echo "virustotal_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}" >> ansible/vault.yml
          echo "wazuh_email_from: ${{ secrets.WAZUH_EMAIL_FROM }}" >> ansible/vault.yml
          echo "wazuh_email_to: ${{ secrets.WAZUH_EMAIL_TO }}" >> ansible/vault.yml
          ansible-vault encrypt ansible/vault.yml --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}")

      - name: Exécution du playbook Wazuh
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/wazuh.yml \
            --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}") \
            -e @ansible/vault.yml
