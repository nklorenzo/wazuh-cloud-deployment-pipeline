---
- name: Installation de Wazuh tout-en-un
  hosts: wazuh
  become: true
  vars_files:
    - vars.yml

  tasks:
    - name: Installation des dépendances
      ansible.builtin.apt:
        name:
          - curl
          - tar
        state: present
        update_cache: true

    - name: Téléchargement du script d'installation Wazuh
      ansible.builtin.get_url:
        url: https://packages.wazuh.com/4.14/wazuh-install.sh
        dest: /tmp/wazuh-install.sh
        mode: '0755'

    - name: Vérification si Wazuh est déjà installé
      ansible.builtin.stat:
        path: /var/ossec/bin/wazuh-control
      register: wazuh_installed

    - name: Lancement de l'installation Wazuh tout-en-un
      ansible.builtin.command: bash /tmp/wazuh-install.sh -a
      args:
        chdir: /tmp
      async: 1800
      poll: 30
      when: not wazuh_installed.stat.exists
      changed_when: true

    - name: Recherche du fichier wazuh-install-files.tar
      ansible.builtin.find:
        paths: ["/tmp", "/root", "/home"]
        patterns: "wazuh-install-files.tar"
        recurse: true
      register: tar_file

    - name: Récupération des credentials Wazuh
      ansible.builtin.command: tar -O -xvf {{ tar_file.files[0].path }} wazuh-install-files/wazuh-passwords.txt
      register: wazuh_credentials
      when: tar_file.files | length > 0
      changed_when: false
      # noqa: command-instead-of-module

    - name: Fichier de credentials introuvable
      ansible.builtin.debug:
        msg: "wazuh-install-files.tar introuvable, récupère les credentials manuellement sur l'instance."
      when: tar_file.files | length == 0

    - name: Affichage des credentials Wazuh
      ansible.builtin.debug:
        msg: "{{ wazuh_credentials.stdout_lines }}"
      when: tar_file.files | length > 0

    - name: Déploiement des règles locales Wazuh
      ansible.builtin.template:
        src: templates/local_rules.xml.j2
        dest: /var/ossec/etc/rules/local_rules.xml
        owner: root
        group: wazuh
        mode: '0640'
      notify: Redémarrer Wazuh Manager

    - name: Téléchargement du script d'installation Tailscale
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: '0755'

    - name: Installation de Tailscale
      ansible.builtin.command: bash /tmp/tailscale-install.sh
      args:
        creates: /usr/bin/tailscale
      changed_when: true

    - name: Authentification Tailscale
      ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }} --accept-routes
      changed_when: true

    - name: Configuration de rsyslog pour recevoir les logs OPNsense
      ansible.builtin.copy:
        content: |
          # Réception des logs syslog UDP
          $ModLoad imudp
          $UDPServerRun 514
          # Logs OPNsense vers fichier dédié
          if $fromhost-ip == '{{ opnsense_ip }}' then /var/log/opnsense.log
          & stop
        dest: /etc/rsyslog.d/opnsense.conf
        owner: root
        group: root
        mode: '0644'
      notify: Redémarrer rsyslog

    - name: Déploiement de la configuration Wazuh (ossec.conf)
      ansible.builtin.template:
        src: templates/ossec.conf.j2
        dest: /var/ossec/etc/ossec.conf
        owner: root
        group: wazuh
        mode: '0640'
      notify: Redémarrer Wazuh Manager

    - name: Création du groupe d'agents SITE-2
      ansible.builtin.file:
        path: /var/ossec/etc/shared/SITE-2
        state: directory
        owner: root
        group: wazuh
        mode: '0750'

    - name: Déploiement de la configuration partagée des agents (agent.conf) SITE-2
      ansible.builtin.template:
        src: templates/agent_site2.conf.j2
        dest: /var/ossec/etc/shared/SITE-2/agent.conf
        owner: root
        group: wazuh
        mode: '0640'
      notify: Redémarrer Wazuh Manager

    - name: Création du groupe d'agents SITE-1
      ansible.builtin.file:
        path: /var/ossec/etc/shared/SITE-1
        state: directory
        owner: root
        group: wazuh
        mode: '0750'

    - name: Déploiement de la configuration partagée des agents (agent.conf) SITE-1
      ansible.builtin.template:
        src: templates/agent_site1.conf.j2
        dest: /var/ossec/etc/shared/SITE-1/agent.conf
        owner: root
        group: wazuh
        mode: '0640'
      notify: Redémarrer Wazuh Manager

    - name: Installation de Postfix et dépendances mail
      ansible.builtin.apt:
        name:
          - postfix
          - libsasl2-modules
        state: present

    - name: Déploiement de la configuration Postfix (main.cf)
      ansible.builtin.template:
        src: templates/main.cf.j2
        dest: /etc/postfix/main.cf
        owner: root
        group: root
        mode: '0644'
      notify: Redémarrer Postfix

    - name: Création du fichier sasl_passwd
      ansible.builtin.copy:
        content: "{{ postfix_sasl_passwd }}"
        dest: /etc/postfix/sasl_passwd
        owner: root
        group: root
        mode: '0600'

    - name: Génération de la base de données sasl_passwd
      ansible.builtin.command: postmap /etc/postfix/sasl_passwd
      changed_when: true

    - name: Injection de la clé VirusTotal dans ossec.conf
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: 'VIRUSTOTAL_API_KEY_PLACEHOLDER'
        replace: "{{ virustotal_api_key }}"
      notify: Redémarrer Wazuh Manager

  handlers:
    - name: Redémarrer Wazuh Manager
      ansible.builtin.systemd:
        name: wazuh-manager
        state: restarted

    - name: Redémarrer Postfix
      ansible.builtin.systemd:
        name: postfix
        state: restarted

    - name: Redémarrer rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
